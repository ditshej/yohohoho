# rig-enforcement base 5 (CI template for Laravel)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: pcov
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - uses: actions/setup-node@v5
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        if: hashFiles('package-lock.json') != ''
        run: npm ci && npm run build
      - name: Prepare app
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
      - name: Pint
        run: vendor/bin/pint --test
      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Prettier (when installed)
        run: if [ -x node_modules/.bin/prettier ]; then node_modules/.bin/prettier --check .; fi
      - name: Pest with coverage
        run: vendor/bin/pest --coverage --min=70

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lockfiles
        run: |
          status=0
          if [ -f composer.json ] && [ ! -f composer.lock ]; then
            echo "::error file=composer.json::composer.json without composer.lock. Commit the lockfile."
            status=1
          fi
          if [ -f package.json ] && [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package.json without package-lock.json. Commit the lockfile."
            status=1
          fi
          exit $status
      - uses: shivammathur/setup-php@v2
        if: (success() || failure()) && hashFiles('composer.lock') != ''
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: composer audit
        if: (success() || failure()) && hashFiles('composer.lock') != ''
        run: composer audit --locked
      - name: npm audit
        if: (success() || failure()) && hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  claude-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: CLAUDE.md length (warning only)
        run: |
          # With Laravel Boost the project part lives in .ai/guidelines/project.md.
          if [ -f .ai/guidelines/project.md ]; then
            lines=$(wc -l < .ai/guidelines/project.md)
          elif [ -d .ai/guidelines ]; then
            lines=$(cat .ai/guidelines/*.md 2>/dev/null | wc -l)
          elif [ -f CLAUDE.md ]; then
            lines=$(wc -l < CLAUDE.md)
            # Follow @imports one level deep (files in the repository only).
            for f in $(grep -oE '(^|[[:space:]])@[^[:space:]]+' CLAUDE.md | sed 's/^[[:space:]]*@//' | sort -u); do
              case "$f" in /*|~*|*..*) continue ;; esac
              if [ -f "$f" ]; then
                lines=$((lines + $(wc -l < "$f")))
              fi
            done
          else
            exit 0
          fi
          if [ "$lines" -gt 60 ]; then
            echo "::warning file=CLAUDE.md::The project part of CLAUDE.md has $lines lines (guide: about 60)."
          fi
